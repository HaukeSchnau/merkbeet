# Nachfolger von onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = darf Build-Skripte ausführen.
allowBuilds:
  # Skias postinstall legt die vorgebauten Native-Bibliotheken an. Es kopiert
  # nur aus schon installierten npm-Paketen (react-native-skia-android und
  # Geschwister), braucht also kein Netz und läuft auch im Nix-Sandbox.
  # Für den Android-Build ist es zwingend.
  "@shopify/react-native-skia": true
